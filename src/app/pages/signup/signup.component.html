<app-auth-card
  title="Create your account 🚀"
  subtitle="Start automating your social media in minutes."
>
  @if (message) {
    <div class="alert">{{ message }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-form-field
      inputId="name"
      label="Full name"
      placeholder="Your name"
      autocomplete="name"
      [control]="form.controls.name"
    />

    <app-form-field
      inputId="email"
      label="Email"
      type="email"
      placeholder="you@example.com"
      autocomplete="email"
      [control]="form.controls.email"
    />

    <app-form-field
      inputId="password"
      label="Password"
      type="password"
      placeholder="At least 8 characters"
      autocomplete="new-password"
      [control]="form.controls.password"
    >
      @if (form.controls.password.value) {
        <div class="strength" [class]="'s' + strength">
          @for (i of [1, 2, 3, 4]; track i) {
            <span [class.on]="i <= strength"></span>
          }
          <small>{{ strengthLabel }}</small>
        </div>
      }
    </app-form-field>

    <app-form-field
      inputId="confirm"
      label="Confirm password"
      type="password"
      placeholder="Repeat your password"
      autocomplete="new-password"
      [control]="form.controls.confirm"
      [extraError]="mismatchError"
    />

    <div class="field">
      <label class="check">
        <input type="checkbox" formControlName="terms" />
        <span>I agree to the <a href="#" class="link">Terms</a> and <a href="#" class="link">Privacy Policy</a></span>
      </label>
      @if (termsError) {
        <p class="error">You need to accept the terms to continue.</p>
      }
    </div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
      {{ loading ? 'Creating account...' : 'Create account' }}
    </button>
  </form>

  <app-social-login text="or sign up with" (chosen)="socialSignup($event)" />

  <p class="auth-foot">
    Already have an account? <a routerLink="/signin" class="link">Sign in</a>
  </p>
</app-auth-card>
